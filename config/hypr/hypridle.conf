# Ociosidade: escurece aos 4 min, bloqueia aos 5, desliga a tela aos 6,
# suspende aos 30 (só na bateria vale a pena; ajuste ao seu gosto).

general {
    # A sessão do Mk instala as configs em ~/.config/mk/hypr (bin/try-session).
    # A tela de bloqueio do Maré; se o Maré não estiver rodando, o hyprlock.
    lock_cmd = qs -p ~/.config/mk/shell ipc call mare lock || pidof hyprlock || hyprlock -c ~/.config/mk/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 240
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
