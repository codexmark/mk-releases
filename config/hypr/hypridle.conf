# Ociosidade: descanso de tela aos 3 min, escurece aos 4, bloqueia aos 5 e
# desliga a tela aos 30. De fábrica o Mk não dorme (quem escolher suspender em
# Ajustes › Energia dorme aos 30). Vale enquanto ninguém mexe em Ajustes ›
# Energia; depois o painel gera o ~/.config/mk/hypridle.conf dele.

general {
    # A sessão do Mk instala as configs em ~/.config/mk/hypr (bin/try-session).
    # A tela de bloqueio do Maré; se o Maré não estiver rodando, o hyprlock.
    lock_cmd = qs -p ~/.config/mk/shell ipc call mare lock || pidof hyprlock || hyprlock -c ~/.config/mk/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 180
    # O descanso de tela do Maré (a marca do Mk); qualquer tecla ou o mouse devolve.
    on-timeout = qs -p ~/.config/mk/shell ipc call mare saver on
    on-resume = qs -p ~/.config/mk/shell ipc call mare saver off
}

listener {
    timeout = 240
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    # Só dorme quem escolheu suspender em "Ao dormir" (Ajustes › Energia,
    # power.sleep). Sem essa escolha, não faz nada.
    on-timeout = ~/.config/mk/shell/scripts/mare-sleep now
}
