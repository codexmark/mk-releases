# Tela de bloqueio do Mk, na linguagem do Maré: fundo grafite, hora grande,
# e o campo de senha como uma pílula sobre uma linha fina, como a barra.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(0B0D10)
}

# Hora
label {
    monitor =
    text = $TIME
    color = rgb(E7E9EC)
    font_size = 96
    font_family = Inter SemiBold
    position = 0, 140
    halign = center
    valign = center
}

# Data, em português
label {
    monitor =
    text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date +"%A, %-d de %B"
    color = rgb(8B929C)
    font_size = 16
    font_family = Inter
    position = 0, 50
    halign = center
    valign = center
}

# A linha
shape {
    monitor =
    size = 70%, 2
    color = rgba(9AA3AD8C)
    rounding = 0
    border_size = 0
    position = 0, -80
    halign = center
    valign = center
}

# A pílula com o campo de senha
input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    rounding = -1
    outer_color = rgb(2A3038)
    inner_color = rgb(161A20)
    font_color = rgb(E7E9EC)
    font_family = JetBrainsMono Nerd Font
    check_color = rgb(45D6B4)
    fail_color = rgb(FF8F66)
    fail_text = senha incorreta
    placeholder_text = <span foreground="##6B727C">senha de $USER</span>
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

# Usuário, abaixo da linha
label {
    monitor =
    text = $USER
    color = rgb(6B727C)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}
